name: CI

permissions: {}

on:
  push:
    branches: [main, "001-**"]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Foundry (contracts)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # Constitution IV: enforced formatting
      - name: Run Forge fmt
        run: forge fmt --check

      # Constitution IV: Router02 must stay under the 24KB EIP-170 limit
      - name: Run Forge build (with sizes)
        run: forge build --sizes

      # Constitution III: all tests green
      - name: Run Forge tests
        run: forge test -vvv

      # Constitution III: ≥ 95% line coverage
      # NOTE: gated until Phase 2 lands real .sol files — empty src/ yields
      # 0% coverage which would fail the gate and produce red CI noise.
      - name: Coverage report
        if: hashFiles('contracts/src/**/*.sol') != ''
        run: forge coverage --no-match-coverage "script/|test/" --ir-minimum

      # Constitution II: gas baseline regression
      # NOTE: gated until Phase 7 (T065) commits the initial .gas-snapshot.
      # `forge snapshot --check` errors when no baseline exists.
      - name: Gas snapshot
        if: hashFiles('contracts/.gas-snapshot') != ''
        run: forge snapshot --check

  frontend:
    name: Next.js (frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # TypeScript strict (noUnusedLocals, noUnusedParameters, erasableSyntaxOnly, verbatimModuleSyntax)
      - name: Type check
        run: npx tsc --noEmit

      # ESLint 10 flat config (js + tseslint + react-hooks + react-refresh)
      - name: Lint
        run: npm run lint

      # Vitest unit + component tests
      - name: Unit tests
        run: npm run test

      # Next.js production build (also catches route-level TS errors)
      - name: Build
        run: npm run build

  e2e:
    name: Playwright E2E
    # TODO: enable after T044 (Phase 3) lands script/DeployDemo.s.sol
    # and T024 (Phase 2) lands frontend/scripts/sync-deploy.ts.
    if: false
    runs-on: ubuntu-latest
    needs: [contracts, frontend]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run test:e2e:install

      - name: Start anvil
        run: |
          anvil --chain-id 31337 --port 8545 &
          sleep 3

      - name: Seed demo contracts
        working-directory: contracts
        run: |
          forge script script/DeployDemo.s.sol:DeployDemo \
            --rpc-url http://127.0.0.1:8545 \
            --broadcast \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            -vvv

      - name: Sync deployed addresses
        run: node scripts/sync-deploy.ts ../contracts/broadcast/31337/run-latest.json 31337

      - name: Run Playwright
        run: npm run test:e2e
